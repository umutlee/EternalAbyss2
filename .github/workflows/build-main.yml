# GitHub Actions: Main branch build with gate tests
name: Main: Build & Gate
on:
  push:
    branches: [ main ]
  tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  tests:
    name: Main: Tests (gate)
    runs-on: ubuntu-latest
    env:
      UNITY_VERSION: ${{ vars.UNITY_VERSION || '2022.3.62f1' }}
      PROJECT_PATH: ${{ vars.PROJECT_PATH || '.' }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: ${{ runner.os }}-Library-${{ env.UNITY_VERSION }}-${{ hashFiles('**/Packages/manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-Library-
      - name: Run PlayMode tests (gate)
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: playmode
          coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;assemblyFilters:+DeepAbyssHive*'
          artifactsPath: artifacts/tests

  build:
    name: Main: Build (Linux x64 Dev)
    needs: tests
    runs-on: ubuntu-latest
    env:
      UNITY_VERSION: ${{ vars.UNITY_VERSION || '2022.3.62f1' }}
      PROJECT_PATH: ${{ vars.PROJECT_PATH || '.' }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: ${{ runner.os }}-Library-${{ env.UNITY_VERSION }}-${{ hashFiles('**/Packages/manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-Library-
      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildName: EA_Dev
          buildMethod: 
          versioning: Custom
          version: 0.1.${{ github.run_number }}
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-dev
          path: build