# GitHub Actions: PlayMode tests + (if pass) Linux build
name: Unity CI
on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:

env:
  # 建議在 GitHub Repository "Variables" 設定 UNITY_VERSION 與 PROJECT_PATH（預設用 .）
  UNITY_VERSION: ${{ vars.UNITY_VERSION || '2022.3.62f1' }}
  PROJECT_PATH: ${{ vars.PROJECT_PATH || '.' }}

jobs:
  tests:
    name: PlayMode Tests (Headless)
    runs-on: ubuntu-latest
    env:
      UNITY_VERSION: ${{ vars.UNITY_VERSION || '2022.3.62f1' }}
      PROJECT_PATH: ${{ vars.PROJECT_PATH || '.' }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: ${{ runner.os }}-Library-${{ env.UNITY_VERSION }}-${{ hashFiles('**/Packages/manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-Library-
      # 自檢：不會洩露內容，只印長度
      - name: Sanity check secrets and vars
        run: |
          echo "UNITY_VERSION=${UNITY_VERSION}"
          echo "PROJECT_PATH=${PROJECT_PATH}"
          echo "UNITY_LICENSE length: ${#UNITY_LICENSE}"
      # 若沒拿到 secrets（例如 fork PR），就跳過，避免紅燈
      - name: Skip if UNITY_LICENSE missing (fork PR / secret not set)
        if: ${{ env.UNITY_LICENSE == '' }}
        run: |
          echo "UNITY_LICENSE is empty -> skipping Unity tests (fork PR or missing secret)."
          exit 0
      - name: Run PlayMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: playmode
          coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;assemblyFilters:+DeepAbyssHive*'
          artifactsPath: artifacts/tests

  build-linux:
    name: Build (Linux x64 Dev)
    needs: tests
    runs-on: ubuntu-latest
    env:
      UNITY_VERSION: ${{ vars.UNITY_VERSION || '2022.3.62f1' }}
      PROJECT_PATH: ${{ vars.PROJECT_PATH || '.' }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: ${{ runner.os }}-Library-${{ env.UNITY_VERSION }}-${{ hashFiles('**/Packages/manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-Library-
      - name: Skip if UNITY_LICENSE missing
        if: ${{ env.UNITY_LICENSE == '' }}
        run: |
          echo "UNITY_LICENSE is empty -> skipping build."
          exit 0
      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildName: EA_Dev
          buildMethod: 
          versioning: Custom
          version: 0.1.${{ github.run_number }}
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: EA_Build_Linux64
          path: build